# Deploys the provin.dev wire surface to S3 + CloudFront.
#
# provin.dev serves one machine-readable wire identifier: the JSON-LD context at
# /vc/v1. (provin's JSON Schemas are served from dplaax.dev, not here.) GitHub
# Pages would serve the extensionless /vc/v1 as application/octet-stream with no
# way to override the header; S3 object metadata serves it as
# application/ld+json. See infra/deploy.md.
#
# The served tree is assembled from this repo: site/ holds the apex root + 404
# (redirect to www.provin.dev); the wire identifier is copied byte-for-byte from
# contexts/v1.jsonld -> /vc/v1.
#
# Disabled — but no longer for the reason this comment used to give. The bucket
# and the distribution DO exist and have been serving since 2026-07-24
# (CloudFront E1HJE4N7OUAJU7 ← OAC ← s3://wire.provin.dev; provin.dev/vc/v1
# answers 200 application/ld+json today). Publishing has been happening through
# infra/deploy.md's manual, sha-guarded fallback.
#
# What is actually missing is the trust path from THIS workflow to that bucket:
#
#   1. a GitHub OIDC identity provider in the AWS account, and an IAM role whose
#      trust policy is scoped to this repository (sub: repo:provin-line/
#      profile.spec:ref:refs/heads/main — a role trusting the whole org would let
#      any repo here write the wire surface);
#   2. four repo secrets: AWS_ROLE_TO_ASSUME, AWS_REGION, S3_BUCKET
#      (wire.provin.dev), CLOUDFRONT_DISTRIBUTION_ID;
#   3. `if: false` removed from the job below.
#
# Until 2026-07-27 there was a fourth blocker that would have made enabling this
# silently useless: the trigger below is `branches: [main]` and this repository
# had no main — its default branch was develop. Renaming develop → main fixed
# that, so the trigger is now real.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: false # disabled — see infra/deploy.md before enabling
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assemble the served tree
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/vc
          cp site/index.html _site/index.html
          cp site/404.html   _site/404.html
          # extensionless identifier object; Content-Type set explicitly below.
          cp contexts/v1.jsonld _site/vc/v1

      - name: Guard byte-exact context (must match the recorded sha256)
        run: |
          set -euo pipefail
          # The same pin the lint workflow's context-pin job enforces.
          expected=$(grep -oE '[0-9a-f]{64}' contexts/README.md | head -1)
          actual=$(sha256sum _site/vc/v1 | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::served /vc/v1 sha256 $actual != recorded $expected"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          set -euo pipefail
          # Defense-in-depth for the highest-consequence failure: this step runs
          # --delete, so refuse any bucket that is not a dedicated wire bucket. A
          # secret misconfigured to an LP bucket (www.*) would otherwise erase the
          # landing page — the exact catastrophe this migration exists to prevent.
          case "$S3_BUCKET" in
            wire.*) ;;
            *) echo "::error::refusing to sync --delete a non-wire bucket: $S3_BUCKET"; exit 1 ;;
          esac
          # The extensionless identifier object is EXCLUDED from the sync: sync
          # would upload it as application/octet-stream and only a later step
          # would repair the type — an interruption (or a CloudFront cache miss
          # in that window) could serve or pin the wrong type. It is uploaded
          # exactly once, below, with the right type. --exclude also applies to
          # the delete scan, so --delete leaves the excluded key alone.
          aws s3 sync _site/ "s3://${S3_BUCKET}/" --delete \
            --exclude "vc/v1"

      - name: Upload the extensionless context object
        run: |
          set -euo pipefail
          # Sole upload path for this key (excluded from the sync above): a
          # single write carrying the correct media type, so the origin never
          # holds it as application/octet-stream, even transiently.
          aws s3 cp _site/vc/v1 "s3://${S3_BUCKET}/vc/v1" \
            --content-type application/ld+json

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
