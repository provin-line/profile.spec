# yaml-language-server: $schema=../tools/rule.schema.json
# provin wire profile — transformationClaim registry.
# File split is non-normative. Entry identity is carried by id (→ README.md).
#
# dPLaaX pins the claim GRAMMAR and the open-world default and stops there:
# "dplaax does not define claim semantics — pinning meaning (closed/open
# world, content relationship) is the profile's job" (dplaax
# credential.claim.grammar). This file is that job.
rules:
  - id: claim.namespace
    status: draft
    class: core
    statement: >-
      A claim in this profile MUST be the token provin:<label> and MUST be
      grounded by a context document mapping the provin prefix to
      https://provin.dev/vocab#; the label MUST be one this profile registers.
    uses: []
    schemas: []
    vectors: [claim-001, claim-002]
    notes: >-
      Grounding is what makes the token mean anything: dplaax
      credential.claim.grounding requires some document in @context to map the
      prefix, and contexts/v1.jsonld is the one that maps this profile's. An
      ungrounded provin: token is a different assertion wearing the same
      spelling, and it is byte-distinguishable — which is the point.

  - id: claim.registry.closed
    status: draft
    class: core
    statement: >-
      This profile's registry is exactly filter, convert, filter-convert,
      aggregate, enrich, generate, and sink-receipt; an issuer MUST NOT emit
      another provin: label, and adding one MUST be a profile version change.
    uses: [claim.namespace]
    schemas: []
    vectors: [claim-003]
    notes: >-
      Closed for ISSUANCE, not for verification. A verifier meeting an
      unregistered provin: label draws no closed-world inference from it
      (dplaax credential.claim.open-world-accept governs that side), so an
      older verifier meeting a newer label is safe by default rather than by
      upgrade. The two directions are deliberately asymmetric: issuance is
      where a claim's meaning is chosen, and an unregistered choice has no
      meaning to choose.

  - id: claim.filter
    status: draft
    class: core
    statement: >-
      provin:filter MUST assert that the output is a content-preserving
      selection of the declared conformant inputs, with nothing added and
      nothing re-encoded, and its information source MUST be closed over them.
    uses: [claim.registry.closed]
    schemas: []
    vectors: [claim-004]
    notes: >-
      Closed means an exclusion inference is licensed: information absent from
      the declared set is absent from the output. That is what makes a recall
      answerable — "this lot cannot be in that output" is a claim about the
      world, and it holds only because the issuer said the set was complete.

  - id: claim.convert
    status: draft
    class: core
    statement: >-
      provin:convert MUST assert that the output is a re-encoding of the
      declared conformant inputs whose information derives entirely from them,
      and its information source MUST be closed over them.
    uses: [claim.registry.closed]
    schemas: []
    vectors: [claim-005]
    notes: >-
      Selection preserves content and drops rows; conversion preserves
      information and changes representation. Both are closed, so both license
      the exclusion inference; they are separate labels because what a
      consumer may conclude about the OUTPUT's shape differs.

  - id: claim.filter-convert
    status: draft
    class: core
    statement: >-
      provin:filter-convert MUST assert selection and re-encoding composed over
      the declared conformant inputs, and its information source MUST be closed
      over them.
    uses: [claim.filter, claim.convert]
    schemas: []
    vectors: [claim-006]
    notes: >-
      A composite is a single registered label, never a join. dplaax
      credential.claim.grammar admits one token and reserves "+" away, so the
      profile spells compositions out — a deliberate divergence from Paper 01
      §4.3's protocol-owned base vocabulary and "+" joins. The cost is that
      each composition needs registering; the benefit is that a verifier never
      parses semantics out of punctuation.

  - id: claim.aggregate
    status: draft
    class: core
    statement: >-
      provin:aggregate MUST assert that the output derives entirely from the
      consumed conformant source set — a closed fold — and under the
      audit-reachable class that set MUST be committed as a SourceCommitment.
    uses: [claim.registry.closed]
    schemas: []
    vectors: [claim-007]
    notes: >-
      The commitment is what makes the closure checkable rather than merely
      asserted: without it, "derives entirely from these" names no set an
      auditor can recompute.

  - id: claim.enrich
    status: draft
    class: core
    statement: >-
      provin:enrich MUST assert that the output derives from the consumed
      conformant inputs PLUS side-fetched non-conformant data, so its
      information MUST NOT be treated as closed over the conformant set.
    uses: [claim.registry.closed]
    schemas: []
    vectors: [claim-008]
    notes: >-
      Conformant-closed, not closed. Exclusion inferences hold for conformant
      flows only — absence from the declared set does not mean absence from
      the output, because the external join is outside every chain. That data
      carries no provenance, so accountability for it concentrates on the
      issuer, which is exactly what the distinct label makes visible: an
      aggregate and an enrich have the same N:1 shape and different warranties.

  - id: claim.generate
    status: draft
    class: core
    statement: >-
      provin:generate MUST assert that the dominant information source is the
      model's weights and that consumed materials are conditioning only; its
      information MUST NOT be treated as closed over the declared set, and no
      exclusion inference is licensed.
    uses: [claim.registry.closed]
    schemas: []
    vectors: [claim-009, claim-010]
    notes: >-
      The weights carry their training corpus, which no chain covers, so the
      output's information is open however complete the declared set looks.
      Declaring a synthesis as aggregate would falsely license the closed-world
      reading: the N:1 shape is identical and the claim is not. When a
      SourceCommitment is emitted it covers the full consumed conformant set —
      the materials, plus the triggering predecessor when chain-preserving —
      and is empty only when no conformant source was consumed (text2img; RFC
      6962 empty-string hash). Model identifier, weights digest, prompt, and
      per-material roles are payload concerns pinned via the registered output
      schema, not claim members.

  - id: claim.sink-receipt
    status: draft
    class: core
    statement: >-
      provin:sink-receipt MUST assert a Sink Process's receipt for consuming
      its predecessor, not a transformation; the issuer MUST set
      previousCredential to the consumed credential and both inputHash and
      outputHash to that credential's outputHash.
    uses: [claim.registry.closed]
    schemas: []
    vectors: [claim-011, claim-012]
    notes: >-
      A sink produces nothing in-network; the receipt exists so the consumption
      is audit-reachable at all. Its identity shape is an ISSUER obligation,
      exactly as every other claim's shape is — a verifier grammar-validates
      and stays open-world, drawing no closed-world inference from a claim it
      does not itself enforce. A consumer that RELIES on the identity checks
      the two hashes itself.

  - id: claim.topology-independence
    status: draft
    class: core
    statement: >-
      A claim MUST NOT be read as constraining chain topology: whether
      previousCredential is present follows the trigger rules alone, and
      whether a source commitment is present is orthogonal to both.
    uses: [claim.registry.closed]
    schemas: []
    vectors: [claim-013]
    notes: >-
      The shape (previousCredential × source commitment) is already visible in
      the wire parameters, so the claim's non-redundant job is the assertion
      about the output's information source. Inferring topology from a claim
      would re-derive what is already stated — and disagree with it when the
      two drift.
